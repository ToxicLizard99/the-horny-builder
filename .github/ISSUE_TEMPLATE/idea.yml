name: Idea
description: Something you'd like the editor to do, or do better.
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like, and what would it help you build?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: In the editor, in 3DXChat's own builder, or not at all.
